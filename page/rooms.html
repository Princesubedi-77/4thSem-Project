<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS - Rooms Management</title>
  <!-- FontAwesome Icons for Edit/Delete icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Container clearing fixed navbar */
    .container {
      max-width: 950px;
      margin-top: 100px; /* Spacing below fixed navbar */
      margin-bottom: 40px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    /* Action Bar with Status Filter and Add Button */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-group label {
      font-size: 14px;
      font-weight: bold;
      color: #333333;
    }

    .status-select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }

    .btn-add {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #333333;
    }

    /* Table Styling */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .custom-table th {
      background-color: #000000;
      color: #ffffff;
      padding: 14px 18px;
      text-align: left;
      font-weight: 600;
    }

    .custom-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
      color: #333333;
      vertical-align: middle;
    }

    .custom-table tbody tr:hover {
      background-color: #f5f5f5;
    }

    /* Status Badges */
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    .status-available {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-occupied {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .status-maintenance {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    /* Action Icon Buttons */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-edit {
      color: #2563eb;
      margin-right: 6px;
    }

    .btn-edit:hover {
      background-color: #eff6ff;
    }

    .btn-delete {
      color: #dc2626;
    }

    .btn-delete:hover {
      background-color: #fef2f2;
    }
  </style>
</head>
<body>

  <!-- Navbar Injection Container -->
  <div id="navbar"></div>

  <!-- Page Content Container -->
  <div class="container">
    
    <!-- Top Controls: Status Filter + Add Room Button -->
    <div class="action-bar">
      <div class="filter-group">
        <label for="statusFilter">Filter Status:</label>
        <select id="statusFilter" class="status-select">
          <option value="all">All Rooms</option>
          <option value="available">Available</option>
          <option value="occupied">Occupied</option>
          <option value="maintenance">Maintenance</option>
        </select>
      </div>

      <button class="btn-add">+ Add Room</button>
    </div>

    <!-- Rooms Table -->
    <table class="custom-table">
      <thead>
        <tr>
          <th style="width: 100px;">Room No</th>
          <th>Type</th>
          <th>Price / Night</th>
          <th>Status</th>
          <th style="width: 100px; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>101</strong></td>
          <td>Single Deluxe</td>
          <td>$120</td>
          <td><span class="status-badge status-available">Available</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Room"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Room"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>102</strong></td>
          <td>Double Suite</td>
          <td>$200</td>
          <td><span class="status-badge status-occupied">Occupied</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Room"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Room"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>103</strong></td>
          <td>Presidential Suite</td>
          <td>$450</td>
          <td><span class="status-badge status-available">Available</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Room"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Room"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>104</strong></td>
          <td>Standard Twin</td>
          <td>$90</td>
          <td><span class="status-badge status-maintenance">Maintenance</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Room"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Room"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="navbar.js"></script>
</body>
</html>
