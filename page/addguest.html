<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add guest</title>
    <style>
 * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background-color: #ffffff;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.form {
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 8px;
    padding: 40px 35px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}



.form h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #000000;
    font-size: 24px;
    letter-spacing: 1px;
    border-bottom: 2px solid #000000;
    padding-bottom: 12px;
}

.form form {
    display: flex;
    flex-direction: column;
}

.form form label,
.form form {
    color: #000000;
    font-size: 14px;
    font-weight: 600;
}

.form input[type="text"],
.form input[type="email"],
.form input[type="number"] {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    background-color: #ffffff;
    color: #000000;
    border: 1.5px solid #000000;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease-in-out;
}

.form input[type="text"]:focus,
.form input[type="email"]:focus,
.form input[type="number"]:focus {
    background-color: #000000;
    color: #ffffff;
}

.form input::placeholder {
    color: #555555;
}

.form input:focus::placeholder {
    color: #cccccc;
}

.btn3 {
    margin-top: 20px;
    padding: 12px;
    background-color: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 4px;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
}

.btn3:hover {
    background-color: #ffffff;
    color: #000000;
}

.btn3:active {
    transform: scale(0.98);
}

    </style>
</head>
<body>
    <div class="form">
    <form action="../database/guest.php" method="POST">
        <label> Name</label>
        <input type="text" placeholder="name" name="name">

        <label> Email</label>
        <input type="email" placeholder="email" name="email">

        <label> Phone</label>
        <input type="number" placeholder="phone" name="phone">

        <button class="btn3"  type="submit">Add</button>
    </form>
    </div>
</body>
</html>
