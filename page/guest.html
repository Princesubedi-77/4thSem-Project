<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS - Guest List</title>
  <!-- FontAwesome Icons for Edit/Delete icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Container clearing fixed navbar */
    .container {
      max-width: 950px;
      margin-top: 100px; /* Spacing below fixed navbar */
      margin-bottom: 40px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    /* Action Bar with Search Input and Add Button */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .search-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-input {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      width: 220px;
    }

    .search-input:focus {
      border-color: #000000;
    }

    .btn-add {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #333333;
    }

    /* Table Styling */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .custom-table th {
      background-color: #000000;
      color: #ffffff;
      padding: 14px 18px;
      text-align: left;
      font-weight: 600;
    }

    .custom-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
      color: #333333;
      vertical-align: middle;
    }

    .custom-table tbody tr:hover {
      background-color: #f5f5f5;
    }

    /* Action Icon Buttons */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-edit {
      color: #2563eb;
      margin-right: 6px;
    }

    .btn-edit:hover {
      background-color: #eff6ff;
    }

    .btn-delete {
      color: #dc2626;
    }

    .btn-delete:hover {
      background-color: #fef2f2;
    }
  </style>
</head>
<body>

  <!-- Navbar Injection Container -->
  <div id="navbar"></div>

  <!-- Page Content Container -->
  <div class="container">
    
    <!-- Top Controls: Search Field + Add Button -->
    <div class="action-bar">
      <div class="search-group">
        <input type="text" class="search-input" placeholder="Search guests...">
      </div>

      <button class="btn-add" href="addguest.html">+ Add Guest</button>
    </div>

    <!-- Guest Table -->
    <table class="custom-table">
      <thead>
        <tr>
          <th style="width: 60px;">S.No</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th style="width: 100px; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Messi</td>
          <td>messi@email.com</td>
          <td>943434</td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Guest"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Guest"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>Ronaldo</td>
          <td>ronaldo@gmail.com</td>
          <td>98343</td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Guest"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Guest"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td>3</td>
          <td>Neymar</td>
          <td>neymar@gmail.com</td>
          <td>98313</td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Guest"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Guest"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td>4</td>
          <td>Penaldo</td>
          <td>penaldo@gmail.com</td>
          <td>98373</td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit" title="Edit Guest"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Guest"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="navbar.js"></script>
</body>
</html>
