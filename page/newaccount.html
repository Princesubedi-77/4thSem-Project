<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<h>, initial-scale=1.0">
    <title>Create new account</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
    
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Arial, sans-serif;
}

body {
    background-color: #ffffff;
    color: #000000;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.login {
    background-color: #ffffff;
    border: 2px solid #000000;
    border-radius: 8px;
    padding: 40px 35px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
}

.login h2 {
    text-align: center;
    margin-bottom: 25px;
    color: #000000;
    font-size: 24px;
    letter-spacing: 1px;
    border-bottom: 2px solid #000000;
    padding-bottom: 12px;
}

.login form {
    display: flex;
    flex-direction: column;
}

.login form label,
.login form {
    color: #000000;
    font-size: 14px;
    font-weight: 600;
}

.login input[type="text"],
.login input[type="email"],
.login input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    margin-top: 6px;
    background-color: #ffffff;
    color: #000000;
    border: 1.5px solid #000000;
    border-radius: 4px;
    font-size: 14px;
    outline: none;
    transition: all 0.2s ease-in-out;
}

.login input[type="text"]:focus,
.login input[type="email"]:focus,
.login input[type="password"]:focus {
    background-color: #000000;
    color: #ffffff;
}

.login input::placeholder {
    color: #555555;
}

.login input:focus::placeholder {
    color: #cccccc;
}

.btn2 {
    margin-top: 20px;
    padding: 12px;
    background-color: #000000;
    color: #ffffff;
    border: 2px solid #000000;
    border-radius: 4px;
    font-size: 15px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.2s ease-in-out;
}

.btn2:hover {
    background-color: #ffffff;
    color: #000000;
}

.btn2:active {
    transform: scale(0.98);
}</style>
</head>
<body>
  
    <div class="login">
        <h2> Create an account</h2>
        <form action="../database/register.php" method="POST">
            First Name <input type="text" placeholder="First name" name="first_name"><br><br>
            Last Name <input type="text" placeholder="Last name" name="last_name"><br> <br>
            Email <input type="email" placeholder="Email" name="email"> <br> <br>
            New Password <input type="password" placeholder="Password" name="password"> <br> <br>
           
            <button class="btn2" type="submit"> log in</button>
        </form>
    </div>
</body>
</html>
