<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS - Staff Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
    }

    .container {
      max-width: 950px;
      margin: 100px auto 40px;
      padding: 0 20px;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-group label {
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .role-select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    .btn-add {
      background: #000;
      color: #fff;
      border: 0;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-add:hover {
      background: #333;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .custom-table th {
      background: #000;
      color: #fff;
      padding: 14px 18px;
      text-align: left;
    }

    .custom-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
      color: #333;
    }

    .custom-table tr:hover {
      background: #f5f5f5;
    }

    .role-badge {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
    }

    .action-btn {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 4px;
    }

    .btn-edit {
      color: #2563eb;
      margin-right: 6px;
    }

    .btn-delete {
      color: #dc2626;
    }

    .btn-edit:hover {
      background: #eff6ff;
    }

    .btn-delete:hover {
      background: #fef2f2;
    }
  </style>
</head>

<body>

  <div id="navbar"></div>

  <div class="container">
    <div class="action-bar">

      <div class="filter-group">
        <label for="roleFilter">Filter by Role:</label>

        <select id="roleFilter" class="role-select">
          <option value="all">All Roles</option>
          <option value="manager">Manager</option>
          <option value="receptionist">Receptionist</option>
          <option value="housekeeping">Housekeeping</option>
          <option value="chef">Chef</option>
        </select>
      </div>

      <button class="btn-add" onclick="window.location.href='addstaff.html'">
        + Add Staff
      </button>

    </div>

    <table class="custom-table">
      <thead>
        <tr>
          <th style="width: 60px;">S.No</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
          <th style="width: 100px; text-align: center;">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>1</td>
          <td>John Don</td>
          <td>john.don@hms.com</td>
          <td>9841234567</td>
          <td><span class="role-badge">Manager</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>

        <tr>
          <td>2</td>
          <td>Neymar</td>
          <td>Neymar.j@hms.com</td>
          <td>9809876543</td>
          <td><span class="role-badge">Receptionist</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>

        <tr>
          <td>3</td>
          <td>Alex Mercer</td>
          <td>alex.m@hms.com</td>
          <td>9812340987</td>
          <td><span class="role-badge">Housekeeping</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>

        <tr>
          <td>4</td>
          <td>Gordon Ramsay</td>
          <td>gordon.r@hms.com</td>
          <td>9856781234</td>
          <td><span class="role-badge">Chef</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-edit"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="navbar.js"></script>
</body>
</html>
