<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HMS - Checkout Management</title>
  <!-- FontAwesome Icons for action icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      margin: 0;
      padding: 0;
    }

    /* Container clearing fixed navbar */
    .container {
      max-width: 950px;
      margin-top: 100px; /* Spacing below fixed navbar */
      margin-bottom: 40px;
      margin-left: auto;
      margin-right: auto;
      padding: 0 20px;
    }

    /* Action Bar with Search/Filter and Add Button */
    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .filter-group label {
      font-size: 14px;
      font-weight: bold;
      color: #333333;
    }

    .status-select {
      padding: 8px 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      background-color: #fff;
      cursor: pointer;
    }

    .btn-add {
      background-color: #000000;
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-add:hover {
      background-color: #333333;
    }

    /* Table Styling */
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .custom-table th {
      background-color: #000000;
      color: #ffffff;
      padding: 14px 18px;
      text-align: left;
      font-weight: 600;
    }

    .custom-table td {
      padding: 14px 18px;
      border-bottom: 1px solid #e0e0e0;
      color: #333333;
      vertical-align: middle;
    }

    .custom-table tbody tr:hover {
      background-color: #f5f5f5;
    }

    /* Payment Status Badges */
    .status-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      display: inline-block;
    }

    .status-paid {
      background-color: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .status-pending {
      background-color: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .status-unpaid {
      background-color: #fee2e2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    /* Action Icon Buttons */
    .action-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 15px;
      padding: 6px 8px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .btn-process {
      color: #16a34a;
      margin-right: 6px;
    }

    .btn-process:hover {
      background-color: #f0fdf4;
    }

    .btn-edit {
      color: #2563eb;
      margin-right: 6px;
    }

    .btn-edit:hover {
      background-color: #eff6ff;
    }

    .btn-delete {
      color: #dc2626;
    }

    .btn-delete:hover {
      background-color: #fef2f2;
    }
  </style>
</head>
<body>

  <!-- Navbar Injection Container -->
  <div id="navbar"></div>

  <!-- Page Content Container -->
  <div class="container">
    
    <!-- Top Controls: Payment Filter + New Checkout Button -->
    <div class="action-bar">
      <div class="filter-group">
        <label for="checkoutFilter">Payment Status:</label>
        <select id="checkoutFilter" class="status-select">
          <option value="all">All Records</option>
          <option value="paid">Paid</option>
          <option value="pending">Pending</option>
          <option value="unpaid">Unpaid</option>
        </select>
      </div>

      <button class="btn-add">+ Process Checkout</button>
    </div>

    <!-- Checkout Table -->
    <table class="custom-table">
      <thead>
        <tr>
          <th style="width: 100px;">Checkout ID</th>
          <th>Guest Name</th>
          <th>Room No</th>
          <th>Amount</th>
          <th>Status</th>
          <th style="width: 120px; text-align: center;">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><strong>#CO-501</strong></td>
          <td>Messi</td>
          <td>101</td>
          <td>$480.00</td>
          <td><span class="status-badge status-paid">Paid</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-process" title="Receipt/Invoice"><i class="fa-solid fa-receipt"></i></button>
            <button class="action-btn btn-edit" title="Edit Record"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Record"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>#CO-502</strong></td>
          <td>Ronaldo</td>
          <td>102</td>
          <td>$800.00</td>
          <td><span class="status-badge status-paid">Paid</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-process" title="Receipt/Invoice"><i class="fa-solid fa-receipt"></i></button>
            <button class="action-btn btn-edit" title="Edit Record"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Record"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>#CO-503</strong></td>
          <td>Neymar</td>
          <td>103</td>
          <td>$900.00</td>
          <td><span class="status-badge status-pending">Pending</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-process" title="Complete Payment"><i class="fa-solid fa-credit-card"></i></button>
            <button class="action-btn btn-edit" title="Edit Record"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Record"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
        <tr>
          <td><strong>#CO-504</strong></td>
          <td>Penaldo</td>
          <td>104</td>
          <td>$270.00</td>
          <td><span class="status-badge status-unpaid">Unpaid</span></td>
          <td style="text-align: center;">
            <button class="action-btn btn-process" title="Complete Payment"><i class="fa-solid fa-credit-card"></i></button>
            <button class="action-btn btn-edit" title="Edit Record"><i class="fa-solid fa-pen-to-square"></i></button>
            <button class="action-btn btn-delete" title="Delete Record"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="navbar.js"></script>
</body>
</html>
