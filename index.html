<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System Login</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
       * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh; /* Better than height */
    background: #ffffff;
}

.card {
    width: 320px;
    padding: 40px 30px;
    background: #ffffff;
    border: 2px solid #000;
    border-radius: 8px;
    box-shadow: 4px 4px 0 #000;
    text-align: center;
}

h1 {
    margin-bottom: 25px;
    font-size: 22px;
    color: #000;
    letter-spacing: 1px;
}

.form-element {
    margin-bottom: 15px;
}

.form-element input {
    width: 100%;
    padding: 10px;
    border: 1px solid #000;
    border-radius: 4px;
    font-size: 14px;
    background: #fff;
    color: #000;
    transition: 0.2s;
}

.form-element input::placeholder {
    color: #666;
}

.form-element input:focus {
    outline: none;
    border: 2px solid #000;
}

.btn {
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
}

.btn:hover {
    background: #333;
}

.btn:active {
    transform: scale(0.98);
}

p {
    margin-top: 15px;
    font-size: 13px;
    color: #000;
}

p a {
    color: #000;
    text-decoration: none;
    font-weight: bold;
}

p a:hover {
    text-decoration: underline;
}
</style>
</head>

<body>

    <div class="card">
        <h1>HOTEL MANAGEMENT SYSTEM</h1>

        <form action="/HMS/database/login.php" method="POST">

            <div class="form-element">
                <input type="text" placeholder="Username" name="first_name" required>
            </div>

            <div class="form-element">
                <input type="password" placeholder="Password" name="password" required>
            </div>

            <button class="btn" type="submit">Log In</button>
        </form>

        <p>Don't have an account? <a href="page/newaccount.html">Sign up</a></p>

    </div>

</body>

</html>
